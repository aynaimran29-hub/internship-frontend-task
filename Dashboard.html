<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - BlogSpace</title>

<style>
    /* Basic page setup */
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }

    /* Navbar */
    .navbar {
        background-color: #7a1f4b;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar h2 {
        color: white;
        margin: 0;
    }

    .navbar .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-size: 15px;
    }

    .navbar .nav-links a:hover {
        text-decoration: underline;
    }

    /* Welcome section */
    .welcome-box {
        background-color: white;
        padding: 25px;
        margin: 25px auto;
        max-width: 800px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    .welcome-box h1 {
        color: #7a1f4b;
        margin-top: 0;
    }

    /* Top bar with title and button */
    .top-bar {
        max-width: 800px;
        margin: 0 auto 15px auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .top-bar h2 {
        color: #333;
    }

    .create-btn {
        background-color: #7a1f4b;
        color: white;
        padding: 10px 18px;
        border-radius: 4px;
        text-decoration: none;
        font-size: 14px;
    }

    .create-btn:hover {
        background-color: #5c1739;
    }

    /* Blog list */
    .blog-list {
        max-width: 800px;
        margin: 0 auto 30px auto;
        padding: 0 20px;
    }

    .blog-card {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 20px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .blog-card h3 {
        color: #7a1f4b;
        margin: 0 0 5px 0;
    }

    .blog-card p {
        color: #777;
        font-size: 13px;
        margin: 0;
    }

    .blog-actions a {
        margin-left: 10px;
        text-decoration: none;
        font-size: 13px;
        font-weight: bold;
    }

    .edit-link {
        color: #2b6fd9;
    }

    .delete-link {
        color: #d92b2b;
    }

    /* Responsive */
    @media (max-width: 500px) {
        .navbar {
            flex-direction: column;
            text-align: center;
        }

        .blog-card {
            flex-direction: column;
            align-items: flex-start;
        }

        .blog-actions {
            margin-top: 10px;
        }
    }
</style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>BlogSpace</h2>
        <div class="nav-links">
            <a href="./Index .html">Home</a>
            <a href="./register.html">Register</a>
            <a href="./Login .html">Login</a>
            <a href="./create blog.html"> new blog</a>
        </div>
    </div

    <!-- Welcome Message -->
    <div class="welcome-box">
        <h1>Welcome, Amna!</h1>
        <p>This is your dashboard. Manage your blog posts below.</p>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <h2>My Blogs</h2>
        </div>
    

    <!-- Blog List -->
    <div class="blog-list">

        <div class="blog-card">
            <div>
                <h3>Getting Started with HTML</h3>
                <p>Published on Sep 10, 2026</p>
            </div>
            <div class="blog-actions">
                <a class="edit-link" href="./create blog.html">Edit</a>
                
            </div>
        </div>

        <div class="blog-card">
            <div>
                <h3>Why CSS Matters</h3>
                <p>Published on Sep 15, 2026</p>
            </div>
            <div class="blog-actions">
                <a class="edit-link" href="./create-blog.html">Edit</a>
        
            </div>
        </div>

    </div>

</body>
</html>
