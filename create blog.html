<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Blog - BlogSpace</title>

<style>
    /* Basic page setup */
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }

    /* Navbar */
    .navbar {
        background-color: #7a1f4b;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar h2 {
        color: white;
        margin: 0;
    }

    .navbar .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-size: 15px;
    }

    .navbar .nav-links a:hover {
        text-decoration: underline;
    }

    /* Form box */
    .form-box {
        background-color: white;
        max-width: 600px;
        margin: 40px auto;
        padding: 25px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .form-box h2 {
        color: #7a1f4b;
        text-align: center;
        margin-top: 0;
    }

    /* Form styling */
    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input[type="text"],
    select,
    textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    textarea {
        resize: vertical;
        min-height: 150px;
    }

    /* Error text */
    .error {
        color: red;
        font-size: 13px;
        display: none;
    }

    /* Publish button */
    button {
        width: 100%;
        padding: 10px;
        margin-top: 20px;
        background-color: #7a1f4b;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #5c1739;
    }

    /* Success message */
    .success {
        color: green;
        text-align: center;
        display: none;
        margin-top: 15px;
    }

    /* Responsive */
    @media (max-width: 500px) {
        .navbar {
            flex-direction: column;
            text-align: center;
        }

        .form-box {
            width: 90%;
            padding: 20px;
        }
    }
</style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>BlogSpace</h2>
        <div class="nav-links">
            <a href="./Index .html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </div>
    </div>

    <!-- Create Blog Form -->
    <div class="form-box">
        <h2>Create New Blog</h2>

        <p class="success" id="successMsg">Blog published successfully!</p>

        <form id="blogForm">

            <label for="title">Blog Title</label>
            <input type="text" id="title" placeholder="Enter blog title">
            <p class="error" id="titleError">Please enter a title</p>

            <label for="category">Category</label>
            <select id="category">
                <option value="">-- Select Category --</option>
                <option value="Technology">Technology</option>
                <option value="Lifestyle">Lifestyle</option>
                <option value="Education">Education</option>
                <option value="Travel">Travel</option>
            </select>
            <p class="error" id="categoryError">Please select a category</p>

            <label for="content">Blog Content</label>
            <textarea id="content" placeholder="Write your blog content here..."></textarea>
            <p class="error" id="contentError">Please write some content (at least 20 characters)</p>

            <button type="submit">Publish Blog</button>

        </form>
    </div>

<script>
    // Get form and input elements
    var form = document.getElementById("blogForm");
    var title = document.getElementById("title");
    var category = document.getElementById("category");
    var content = document.getElementById("content");

    var titleError = document.getElementById("titleError");
    var categoryError = document.getElementById("categoryError");
    var contentError = document.getElementById("contentError");
    var successMsg = document.getElementById("successMsg");

    // Run this when the form is submitted
    form.addEventListener("submit", function (e) {
        e.preventDefault(); // stop the form from refreshing the page

        var isValid = true;

        // Check title is not empty
        if (title.value.trim() === "") {
            titleError.style.display = "block";
            isValid = false;
        } else {
            titleError.style.display = "none";
        }

        // Check category is selected
        if (category.value === "") {
            categoryError.style.display = "block";
            isValid = false;
        } else {
            categoryError.style.display = "none";
        }

        // Check content length
        if (content.value.trim().length < 20) {
            contentError.style.display = "block";
            isValid = false;
        } else {
            contentError.style.display = "none";
        }

        // If everything is correct, show success message
        if (isValid) {
            successMsg.style.display = "block";

            // Go back to dashboard after 1 second
            setTimeout(function () {
                window.location.href = "dashboard.html";
            }, 1000);
        }
    });
</script>

</body>
</html>
