<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Page</title>

<style>
    /* Basic page setup */
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }

    /* Simple navbar */
    .navbar {
        background-color: #7a1f4b;
        padding: 15px;
        text-align: center;
    }

    .navbar h2 {
        color: white;
        margin: 0;
    }

    /* Register box in the center */
    .register-box {
        background-color: white;
        width: 320px;
        margin: 50px auto;
        padding: 25px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .register-box h2 {
        text-align: center;
        color: #7a1f4b;
    }

    /* Form styling */
    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    /* Error text */
    .error {
        color: red;
        font-size: 13px;
        display: none;
    }

    /* Register button */
    button {
        width: 100%;
        padding: 10px;
        margin-top: 20px;
        background-color: #7a1f4b;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #5c1739;
    }

    /* Login link */
    .login-text {
        text-align: center;
        margin-top: 15px;
    }

    /* Success message */
    .success {
        color: green;
        text-align: center;
        display: none;
        margin-top: 15px;
    }

    /* Make it responsive on small screens */
    @media (max-width: 400px) {
        .register-box {
            width: 90%;
        }
    }
</style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>BlogSpace</h2>
    </div>

    <!-- Register Form -->
    <div class="register-box">
        <h2>Register</h2>

        <p class="success" id="successMsg">Account created successfully!</p>


        <form id="registerForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <p class="error" id="nameError">Please enter your name</p>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email">
            <p class="error" id="emailError">Please enter a valid email</p>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password">
            <p class="error" id="passwordError">Password must be at least 6 characters</p>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password">
            <p class="error" id="confirmError">Passwords do not match</p>

            <button type="submit">SUBMIT</button>
        

        </form>

        <p class="login-text">
            Already have an account? <a href="./Login .html">Login here</a>
        </p>
    
        </p>
    </div>

<script>
    // Get form and input elements
    var form = document.getElementById("registerForm");
    var name = document.getElementById("name");
    var email = document.getElementById("email");
    var password = document.getElementById("password");
    var confirmPassword = document.getElementById("confirmPassword");

    var nameError = document.getElementById("nameError");
    var emailError = document.getElementById("emailError");
    var passwordError = document.getElementById("passwordError");
    var confirmError = document.getElementById("confirmError");
    var successMsg = document.getElementById("successMsg");

    // Run this when the form is submitted
    form.addEventListener("submit", function (e) {
        e.preventDefault(); // stop the form from refreshing the page

        var isValid = true;

        // Check name is not empty
        if (name.value.trim() === "") {
            nameError.style.display = "block";
            isValid = false;
        } else {
            nameError.style.display = "none";
        }

        // Check email contains @ and .
        if (email.value.includes("@") && email.value.includes(".")) {
            emailError.style.display = "none";
        } else {
            emailError.style.display = "block";
            isValid = false;
        }

        // Check password length
        if (password.value.length >= 6) {
            passwordError.style.display = "none";
        } else {
            passwordError.style.display = "block";
            isValid = false;
        }

        // Check password and confirm password match
        if (confirmPassword.value === password.value && confirmPassword.value !== "") {
            confirmError.style.display = "none";
        } else {
            confirmError.style.display = "block";
            isValid = false;
        }

        // If everything is correct, send data to backend
if (isValid) {
    fetch("http://localhost:5000/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: name.value,
            email: email.value,
            password: password.value
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.message === "Registration successful!") {
            successMsg.style.display = "block";
            setTimeout(function () {
                window.location.href = "login.html";
            }, 1000);
        } else {
            alert(data.message); // e.g. "Ye email pehle se registered hai"
        }
    })
    .catch(err => {
        alert("Server se connect nahi ho saka. Check karo backend chal raha hai.");
        console.log(err);
    });
}
    });
</script>

</body>
</html>
